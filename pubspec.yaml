name: whoami_app
description: "Who Am I – app móvil"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # --- UI / Diseño ---
  table_calendar: ^3.1.2
  confetti: ^0.8.0

  # --- Firebase ---
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.4.10
  firebase_messaging: ^15.2.10
  google_sign_in: ^6.3.0

  # --- Navegación / Estado ---
  go_router: ^14.8.1
  provider: ^6.1.5+1

  # --- Biometría / PIN ---
  local_auth: ^3.0.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # --- Cámara / Galería ---
  image_picker: ^1.1.2

  # --- Texto a voz ---
  flutter_tts: ^4.2.3

  # --- Permisos ---
  permission_handler: ^12.0.1

  # --- WebView ---
  flutter_inappwebview: ^6.0.0+5

  # --- Notificaciones locales ---
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1

  # --- Mapas ---
  google_maps_flutter: ^2.7.0

  # --- Geolocalización ---
  geolocator: ^14.0.2

  # --- Vibración / Alertas ---
  vibration: ^3.1.4

  # --- Apertura de URLs ---
  url_launcher: ^6.3.0

  # --- Inteligencia Artificial (Gemini) ---
  google_generative_ai: ^0.4.7
  flutter_dotenv: ^6.0.0

  # --- Splash ---
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/assistant.png   # 🧠💜 avatar del asistente

# --- ICONO DE LA APLICACIÓN ---
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo.png"

# --- SPLASH SCREEN BLANCO ---
flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#FFFFFF"
  image: assets/logo.png
  android: true
  ios: true
  web: false
  android_12:
    color: "#FFFFFF"
    image: assets/logo.png
    icon_background_color: "#FFFFFF"
